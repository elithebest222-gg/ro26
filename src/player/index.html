<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>webblox player</title>
		<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="player.css" />
		<script type="module" src="boot.js"></script>
	</head>
	<body>
		<!-- Element ids below are the contract with Roblox's WasmPlayer.js. -->
		<canvas id="canvas" tabindex="-1"></canvas>

		<div id="input-container">
			<textarea id="input-textarea" rows="1" autocapitalize="off" aria-label="Text input"></textarea>
			<input id="input-input" type="text" autocapitalize="off" aria-label="Text input" />
		</div>

		<div id="loading-overlay" aria-busy="true" aria-label="Loading Roblox">
			<div class="loading-backdrop"><img id="loading-background-image" alt="" /></div>

			<div class="loading-card">
				<div id="loading-icon-shell" class="loading-icon-shell"><img id="loading-experience-icon" alt="" /></div>
				<h1 id="loading-experience-title">webblox</h1>
				<p class="loading-creator">
					<span id="loading-experience-creator" hidden></span>
					<svg id="loading-verified-badge" hidden viewBox="0 0 16 16" width="14" height="14" aria-label="Verified">
						<path fill="currentColor" d="M8 .8l1.9 1.4 2.3-.2.8 2.2 2 1.2-.6 2.3.6 2.3-2 1.2-.8 2.2-2.3-.2L8 14.6l-1.9-1.4-2.3.2-.8-2.2-2-1.2.6-2.3L1 5.4l2-1.2.8-2.2 2.3.2z" />
						<path fill="#0b0d12" d="M6.9 10.6L4.6 8.3l1-1 1.3 1.3 3.5-3.5 1 1z" />
					</svg>
				</p>
				<div class="loading-bar" aria-hidden="true"><span></span></div>
				<p id="status" role="status" aria-live="polite">Starting…</p>

				<div id="boot-prompt" class="boot-prompt" hidden>
					<p id="boot-prompt-text"></p>
					<div class="boot-actions">
						<a id="boot-prompt-primary" class="btn primary" href="../"></a>
						<button id="boot-prompt-secondary" class="btn" type="button"></button>
					</div>
				</div>

				<button id="loading-cancel" class="btn ghost" type="button">Cancel</button>
			</div>

			<div class="loading-error-panel" role="alertdialog" aria-labelledby="loading-error-title" hidden>
				<h2 id="loading-error-title">Error</h2>
				<p id="loading-error-message"></p>
				<p id="loading-error-code"></p>
				<button id="loading-error-leave" class="btn primary" type="button">Leave</button>
			</div>
		</div>

		<div class="engine-info" aria-hidden="true">
			<span id="server"></span>
			<span id="proxyenabled"></span>
		</div>
	</body>
</html>
